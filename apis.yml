  detail: >-
    F&G is an insurance carrier, not a software vendor — it sells annuities and life policies through
    appointed agents and ships no software product, so there is no developer program: the humanURL this record carried,
    developer.fglife.com, does not resolve in DNS, and api.fglife.com is a live Azure Front Door that
    answers a bare JSON 404 to every public path including /openapi.json, /swagger.json, /api-docs,
    /graphql and the full /.well-known/ named list; the only machine-readable document on the estate is
    the OpenID Connect discovery doc at auth.fglife.com gating the appointment-only SalesLink portal.
