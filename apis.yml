apis:
  - aid: fgl-holdings:fgl-holdings-identity
    name: F&G Identity (auth.fglife.com)
    tags:
      - Insurance
      - Financial-Services
      - Authentication
      - OpenID-Connect
    tags_raw:
      - Insurance
      - Financial Services
      - Authentication
      - OpenID Connect
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://auth.fglife.com
    humanURL: https://www.fglife.com/contact/agent-support
    description: >-
      The only machine-readable API surface F&G Annuities & Life publishes. auth.fglife.com is an Auth0
      custom domain fronting the prod.fglife.auth0.com tenant, serving a complete OpenID Connect
      discovery document and RFC 8414 authorization-server metadata anonymously. It gates the SalesLink
      financial-professional portal and the policyholder portal. It supports Authorization Code with
      PKCE (S256), client credentials, refresh tokens, device code, token exchange, DPoP (ES256), CIBA
      and back-channel logout. This is an identity surface, NOT a product API — there is no public
      client registration, and credentials are issued only to appointed distribution partners.
    properties:
      - url: well-known/fgl-holdings-auth-openid-configuration.json
        type: OpenIDConnect
      - url: authentication/fgl-holdings-authentication.yml
        type: Authentication
      - url: scopes/fgl-holdings-scopes.yml
        type: OAuthScopes
