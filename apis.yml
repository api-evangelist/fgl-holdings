description: >-
  FGL Holdings is the legacy holding-company name for F&G Annuities & Life, Inc., a US life insurance
  and annuity carrier headquartered in Des Moines, Iowa and majority-owned by Fidelity National
  Financial (FNF). F&G issues fixed indexed annuities (FIA), multi-year guaranteed annuities (MYGA),
  registered index-linked annuities (RILA), indexed universal life insurance, and pension risk transfer
  group annuities, distributing exclusively through appointed independent agents, Independent Marketing
  Organizations (IMOs) and bank/broker-dealer partners. F&G publishes NO public developer API, no
  developer portal and no machine-readable product contract — verified by direct probe on 2026-09-14.
  What it does serve anonymously is a complete OpenID Connect discovery document at auth.fglife.com, the
  first-party authorization server gating its SalesLink financial-professional portal.
