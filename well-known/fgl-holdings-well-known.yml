description: >-
  Well-known discovery probe for F&G Annuities & Life (FGL Holdings). Two real documents are served, and
  both sit on the identity tier rather than a product API: auth.fglife.com — the company's Auth0 custom
  domain fronting the prod.fglife.auth0.com tenant — publishes a complete OpenID Connect discovery
  document and the RFC 8414 OAuth 2.0 authorization-server metadata at the same body. This is the
  authorization server behind the SalesLink financial-professional portal. No security.txt, api-catalog
  or ai-plugin manifest is served anywhere on the estate.
notes: >-
  mypolicy.fglife.com answers HTTP 200 with an HTML single-page-app shell for EVERY /.well-known/* path
  probed, including paths that cannot exist. Those are recorded as misses, not hits — a soft-200 SPA
  catch-all is not a served document. developer.fglife.com does not resolve in DNS (NXDOMAIN) and is
  recorded with status 0.
