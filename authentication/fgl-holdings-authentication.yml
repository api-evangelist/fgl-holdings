providerId: fgl-holdings
description: >-
  F&G Annuities & Life (FGL Holdings) publishes no public product API and no developer authentication
  guide. It does operate a real, first-party OpenID Connect authorization server at auth.fglife.com — an
  Auth0 custom domain fronting the prod.fglife.auth0.com tenant — which serves a complete OIDC discovery
  document anonymously. Everything below is read verbatim from that document, not from prose. The
  authorization server gates the SalesLink financial-professional portal; access is granted through an
  IMO/broker-dealer appointment, not self-service registration, so no member of the public can obtain a
  client credential.
notes: >-
  This artifact profiles an IDENTITY surface, not a product API. Recording it does not assert that F&G
  offers a callable public API — it does not. See conventions/ and the apis.yml x-coverage block.
issuer: https://auth.fglife.com/
alternate_issuer: https://prod.fglife.auth0.com/
provider_platform: Auth0 (custom domain)
schemes:
  - name: oidc_authorization_code_pkce
    type: openIdConnect
    in: header
    scheme: bearer
    bearer_format: JWT
    openid_connect_url: https://auth.fglife.com/.well-known/openid-configuration
    description: >-
      Authorization Code with PKCE. Observed live: saleslink.fglife.com issues a 302 to
      https://auth.fglife.com/authorize with response_type=code, code_challenge_method=S256,
      response_mode=form_post and scope "offline_access openid profile email".
    evidence: https://saleslink.fglife.com/ (HTTP 302, Location header)
    public_client_registration: false
  - name: oauth2_client_credentials
    type: oauth2
    flow: clientCredentials
    token_endpoint: https://auth.fglife.com/oauth/token
    description: >-
      Declared in grant_types_supported. No public client registration; credentials are issued to
      appointed distribution partners only.
    gated: true
